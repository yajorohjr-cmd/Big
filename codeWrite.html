<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byte Wire - Ultimate Animator</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        body { 
            background-color: #0d0d0d; 
            margin: 0; padding: 20px;
            color: #fff; font-family: 'Consolas', monospace;
            overflow-x: hidden;
        }
        .controls {
            background: #1a1a1a; border: 2px solid #00ff41;
            padding: 20px; border-radius: 10px; margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }
        textarea { 
            width: 100%; height: 100px; background: #000; color: #00ff41; 
            border: 1px solid #333; padding: 10px; font-family: monospace;
            margin-bottom: 15px;
        }
        .param-row { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #00ff41; margin-bottom: 5px; text-transform: uppercase; }
        
        button { 
            background: #00ff41; color: #000; border: none; padding: 15px; 
            width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }

        /* Mode Plein Ecran */
        #display-container { display: none; width: 100%; }
        .running .controls { display: none; }
        .running #display-container { display: block; }
        
        /* Eto no mampihatra ilay Taille de Police */
        pre { background: transparent !important; margin: 0 !important; padding: 0 !important; }
        code { white-space: pre-wrap !important; word-break: break-all; }
    </style>
</head>
<body id="mainBody">

    <div class="controls">
        <h2 style="color:#00ff41; margin-top:0; letter-spacing: 2px;">BYTE WIRE // STUDIO</h2>
        
        <textarea id="inputArea" placeholder="// Paste your code here..."></textarea>
        
        <div class="param-row">
            <label>Vitesse (Hafainganam-pandeha):</label>
            <input type="range" id="speedSlider" min="1" max="100" value="85" style="width:100%; accent-color:#00ff41;">
        </div>

        <div class="param-row">
            <label>Taille de police (Haben'ny soratra):</label>
            <input type="range" id="sizeSlider" min="12" max="40" value="20" style="width:100%; accent-color:#00ff41;">
        </div>

        <button onclick="startAnimation()">START ENCODING (RECORD)</button>
    </div>

    <div id="display-container">
        <pre><code id="display" class="language-javascript"></code></pre>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <script>
        function startAnimation() {
            const input = document.getElementById('inputArea').value;
            const display = document.getElementById('display');
            const speedSlider = document.getElementById('speedSlider');
            const sizeSlider = document.getElementById('sizeSlider');
            const body = document.getElementById('mainBody');

            if(!input) return alert("Ampidiro aloha ny code!");

            // Ampiharina ny haben'ny soratra nofidiana
            display.style.fontSize = sizeSlider.value + "px";

            body.classList.add('running');
            display.textContent = "";
            
            let i = 0;
            function typeWriter() {
                if (i < input.length) {
                    display.textContent += input.charAt(i);
                    Prism.highlightElement(display);
                    i++;
                    
                    // Ny vitesse dia arakaraka ny slider
                    setTimeout(typeWriter, 105 - speedSlider.value);
                    
                    // Auto-scroll mba ho hita foana ny andalana farany
                    window.scrollTo(0, document.body.scrollHeight);
                } else {
                    // Rehefa vita dia miandry 4s vao miverina ny menu
                    setTimeout(() => body.classList.remove('running'), 4000);
                }
            }
            typeWriter();
        }
    </script>
</body>
</html>
